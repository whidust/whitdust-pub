<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Whitdust">
  <defs>
    <radialGradient id="bg" cx="36%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#eef8fe"/>
      <stop offset="100%" stop-color="#c3e1f7"/>
    </radialGradient>
  </defs>

  <!-- 圆盘 -->
  <circle cx="16" cy="16" r="14.9" fill="url(#bg)" stroke="#1a9bd8" stroke-width="1.7"/>

  <!-- 锥体：一个三角，中间竖着分开，左右两个面明度不同 —— 这就是"有体积"的全部暗示 -->
  <path d="M15.6 6.4 L6.6 25 L15.6 25 Z" fill="#6f8fc0"/>
  <path d="M16.4 6.4 L25.4 25 L16.4 25 Z" fill="#b3d9f2"/>

  <!-- 底面那一小截，让锥体坐在一个平面上，不是飘着的三角 -->
  <path d="M6.6 25 L25.4 25" stroke="#4a7fb5" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- 顶点一点高光 -->
  <circle cx="16" cy="6.4" r="1.5" fill="#ffffff" opacity="0.85"/>
</svg>
